name: CI

# Deploy only runs on main, so without this a pull request would get no validation at all.
on:
  pull_request:
  push:
    branches-ignore:
      - main # main is already covered by the deploy workflow's build job
  workflow_dispatch:

# A push to a branch with an open PR fires both triggers, so dedupe on the commit itself.
# Keying on github.ref does not work here: it is refs/heads/<branch> for a push but
# refs/pull/<n>/merge for a pull_request, putting the two runs in different groups.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner has no preinstalled browser, and PLAYWRIGHT_BROWSERS_PATH is unset
      # here, so playwright.config.ts leaves executablePath undefined and Playwright
      # manages its own matching build.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
